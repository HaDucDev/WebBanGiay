name: webbangiay

services:
  mysql:
    image: mysql:8.0.29
    pull_policy: missing
    container_name: webbangiay-mysql
    restart: unless-stopped
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run START_MYSQL.bat to create .env}
      MYSQL_DATABASE: Web_Ban_Giay
      MYSQL_USER: ${MYSQL_USER:-webgiay}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run START_MYSQL.bat to create .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - type: bind
        source: ./Web_Ban_Giay.sql
        target: /docker-entrypoint-initdb.d/01-init.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP
          --host=127.0.0.1 --user="$${MYSQL_USER}"
          --database="$${MYSQL_DATABASE}" --batch --skip-column-names
          --execute="SELECT COUNT(*) FROM product;" > /dev/null 2>&1
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30

volumes:
  mysql-data:
    name: webbangiay-mysql-data
